## Review 节点定义

```yaml
review_checkpoints:
  - checkpoint: "RC1"
    name: "需求 Review"
    after_step: 2
    reviewers: ["Product Owner", "Stakeholder"]
    criteria:
      - 所有 User Story 清晰明确
      - Acceptance Criteria 可验证
      - 业务规则无歧义

  - checkpoint: "RC2"
    name: "架构 Review"
    after_step: 4
    reviewers: ["Tech Lead", "Architect"]
    criteria:
      - 技术选型合理
      - 可实现性确认
      - 非功能性需求已考虑

  - checkpoint: "RC3"
    name: "设计 Review"
    after_step: 5
    reviewers: ["Tech Lead", "Developers"]
    criteria:
      - API 契约完整
      - 数据模型清晰
      - 任务拆解可执行

  - checkpoint: "RC4"
    name: "代码 Review"
    after_step: 6
    reviewers: ["Tech Lead", "Peers"]
    criteria:
      - 代码符合规范
      - 测试覆盖充分
      - 文档完整

  - checkpoint: "RC5"
    name: "测试 Report"
    after_step: 7
    reviewers: ["Product Owner", "QA Lead"]
    criteria:
      - 所有 AC 验证通过
      - 缺陷已修复或记录
      - 可发布结论
```

