name: Deploy to ALIBABA VM 47.108.128.71

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ 拉取代码
        uses: actions/checkout@v4

      - name: 🔐 配置 SSH
        uses: appleboy/ssh-action@v2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ~/code/ai-software-zero-2-one
            git pull origin master
            chmod +x deploy-agent-server.sh
            ./deploy-agent-server.sh